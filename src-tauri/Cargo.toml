[package]
name = "noctbeat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Noctbeat desktop app (Tauri shell)"

[lib]
name = "noctbeat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "noctbeat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde.workspace = true
serde_json.workspace = true
noctbeat-core = { path = "../crates/noctbeat-core" }
ureq = "2"
rodio = "0.23.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.3.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-global-shortcut = "2.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false, features = ["async-io", "blocking"] }
discord-rich-presence = "0.2"
