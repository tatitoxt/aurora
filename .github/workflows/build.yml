name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: macos-latest, target: macos }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libasound2-dev
      - run: pnpm install --frozen-lockfile
      # Signing env is only exported when the secret is actually set — an
      # empty-string TAURI_SIGNING_PRIVATE_KEY makes tauri-action attempt
      # signing and fail the whole build.
      - name: Configure updater signing
        shell: bash
        run: |
          if [ -n "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # tauri-action builds every bundle and — on tag pushes — opens a
      # draft GitHub Release with installers + updater artifacts
      # (latest.json + .sig files). Without the signing secret the release
      # is published unsigned and in-app auto-update stays disabled.
      - uses: tauri-apps/tauri-action@v0
        with:
          # On tag pushes, creates (or attaches to) the release for this tag.
          tagName: ${{ github.ref_name }}
          releaseName: 'Noctbeat ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Non-tag builds (workflow_dispatch, PRs): keep the raw bundles as
      # workflow artifacts since no release is created for them.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: noctbeat-bundles
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: ignore
