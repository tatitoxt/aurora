name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tauri-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libasound2-dev xvfb
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --locked
      # `cargo build` produces a binary that loads devUrl (vite dev server); the e2e
      # must embed frontendDist instead, which `tauri build --debug` does.
      - run: pnpm exec tauri build --debug --no-bundle
      - name: tauri-driver smoke (demo mode)
        run: xvfb-run -a node e2e/app.test.mjs
        env:
          NOCTBEAT_DEMO: "1"
          NOCTBEAT_BIN: ./target/debug/noctbeat
